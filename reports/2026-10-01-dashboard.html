<title>Owner Audit Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: ledger-style. Summary strip, two money bars, then a tabbed, filterable table. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1b2230; --ink2:#4a5568; --muted:#7a8496; --line:#dfe3ea; --line2:#eef0f4;
  --accent:#27447a; --accent-soft:#e6ecf7;
  --red:#b3261e; --red-soft:#fbe9e7; --amber:#8a5a00; --amber-soft:#fdf1d6; --ok:#1d6b43; --ok-soft:#e3f3ea;
  --bar-unpaid:#b3261e; --bar-paid:#5b6b8c;
  --f-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-num:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1a202a; --ink:#e8ecf3; --ink2:#b4bdcc; --muted:#8892a3; --line:#2b3340; --line2:#232a35;
  --accent:#8fb0f0; --accent-soft:#22304d; --red:#ff8a80; --red-soft:#3a1f1e; --amber:#f1c35b; --amber-soft:#3a2f14; --ok:#6fd0a0; --ok-soft:#173226;
  --bar-unpaid:#ff8a80; --bar-paid:#8c9bbb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1a202a; --ink:#e8ecf3; --ink2:#b4bdcc; --muted:#8892a3; --line:#2b3340; --line2:#232a35;
  --accent:#8fb0f0; --accent-soft:#22304d; --red:#ff8a80; --red-soft:#3a1f1e; --amber:#f1c35b; --amber-soft:#3a2f14; --ok:#6fd0a0; --ok-soft:#173226;
  --bar-unpaid:#ff8a80; --bar-paid:#8c9bbb; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;padding-inline:max(16px,3vw);padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 24px}
h1{font-size:22px;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.tag{font-family:var(--f-num);font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:4px}
.alert{background:var(--amber-soft);color:var(--ink);border:1px solid var(--amber);border-radius:6px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.alert b{color:var(--amber)}
.alert button{margin-left:auto;font:inherit;color:var(--accent);background:none;border:0;text-decoration:underline;cursor:pointer;padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-num);font-size:26px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .n{font-size:12px;color:var(--ink2);margin-top:2px}
.kpi.red .v{color:var(--red)} .kpi.amb .v{color:var(--amber)} .kpi.ok .v{color:var(--ok)}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.panel h2{font-size:13px;font-weight:600;margin:0 0 10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 84px;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.bar .nm{overflow-wrap:anywhere;color:var(--ink)}
.bar .tr{height:10px;background:var(--line2);border-radius:2px}
.bar .fi{height:10px;border-radius:2px 4px 4px 2px}
.bar .am{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.bar:hover .nm{text-decoration:underline}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tab{font:inherit;background:none;border:0;border-bottom:2px solid transparent;color:var(--ink2);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent);font-weight:600}
.tab .c{font-family:var(--f-num);font-size:11px;background:var(--line2);border-radius:10px;padding:1px 7px;margin-left:6px;color:var(--ink2)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px;min-width:0}
input[type=search]{flex:1 1 220px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip{font:inherit;font-size:12px;background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.count{margin-left:auto;font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:68vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:600;font-size:12px;color:var(--ink2);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
th:hover{color:var(--accent)}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top;overflow-wrap:anywhere;min-width:70px}
tr:hover td{background:var(--accent-soft)}
td.num{font-family:var(--f-num);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.p-RED{background:var(--red-soft);color:var(--red)} .p-YELLOW{background:var(--amber-soft);color:var(--amber)}
.p-Paid{background:var(--line2);color:var(--ink2)} .p-Unpaid{background:var(--red-soft);color:var(--red)}
.p-High{background:var(--red-soft);color:var(--red)} .p-Medium{background:var(--amber-soft);color:var(--amber)} .p-Low,.p-Info{background:var(--line2);color:var(--ink2)}
.p-MATCH,.p-Done{background:var(--ok-soft);color:var(--ok)}
a.id{font-family:var(--f-num);font-size:12px;color:var(--accent);margin-right:6px;white-space:nowrap}
.note{color:var(--muted);font-size:12px}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
button.kpi:hover,.kpi:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
td.lk{cursor:pointer}td.lk:hover{color:var(--accent);text-decoration:underline}
td.lk .pill{cursor:pointer}td.lk .pill:hover{outline:2px solid var(--accent)}
tbody tr{cursor:pointer}
.kpi .v{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:2px}
.kpi .go2{font-size:12px;color:var(--accent);margin-top:6px;font-weight:600}
.kpi:hover .go2{text-decoration:underline}
.bar .am{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:500}
.bar .am::after{content:' \2192'}
td.amt{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
td.amt:hover{text-decoration:underline}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:6px;padding:8px 12px}
.fbar b{font-family:var(--f-num);font-weight:500}
.res{display:flex;flex-direction:column;gap:8px}
.res button{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:grid;gap:3px}
.res button:hover{border-color:var(--accent)}
.res .t{font-weight:600;overflow-wrap:anywhere}.res .m{font-size:12px;color:var(--ink2);overflow-wrap:anywhere}
.acct{color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-family:var(--f-num);font-size:.95em}
.acct:hover{background:var(--accent-soft);text-decoration:underline}
.alert .go{margin-left:auto}
.dim{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;justify-content:flex-end;z-index:10}
.drawer{background:var(--surface);color:var(--ink);width:min(520px,100%);height:100%;overflow-y:auto;padding:20px 18px 32px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-left:1px solid var(--line);display:flex;flex-direction:column;gap:14px}
.drawer h3{margin:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.drawer dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:8px 12px}
.drawer dt{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.drawer dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:13px;background:var(--surface);color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:6px 12px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--accent-soft)}
.btn.x{color:var(--ink2);border-color:var(--line)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
@media (max-width:560px){.bar{grid-template-columns:1fr 78px}.bar .tr{grid-column:1/3;order:3}}
</style>

const ACCT=/\b\d{3}-\d{3}-\d{3}\b|\b\d{6}-\d{1,5}\b|\b\d{6,}\b|\bOI-\d{3}\b/g;
function linkify(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('a,button,.acct,.pill,script,style')?NodeFilter.FILTER_REJECT:(ACCT.lastIndex=0,ACCT.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT)}),nodes=[];
 while(w.nextNode())nodes.push(w.currentNode);
 nodes.forEach(n=>{const f=document.createDocumentFragment();let last=0;n.nodeValue.replace(ACCT,(m,off)=>{f.append(n.nodeValue.slice(last,off));const a=document.createElement('span');a.className='acct';a.dataset.tok=m;a.tabIndex=0;a.setAttribute('role','link');a.title='Show every row that mentions '+m;a.textContent=m;f.append(a);last=off+m.length;return m});f.append(n.nodeValue.slice(last));n.replaceWith(f)})}
function panel(title,idxs,apply,extra){closeRow();lastFocus=document.activeElement;
 const d=document.createElement('div');d.className='dim';d.id='dim';
 const tot=idxs.reduce((s,i)=>s+(typeof D.F[i][7]==='number'?D.F[i][7]:0),0);
 d.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="${title}"><div class="top"><h3>${title}</h3><button class="btn x" id="cl">Close</button></div><div class="note">${idxs.length} line${idxs.length===1?'':'s'}${tot?' · '+fmt(Math.round(tot*100)/100)+' listed':''}${extra?'. '+extra:''}</div><div class="acts">${idxs.length?'<button class="btn" id="all">Show these in the table</button>':''}</div><div class="res">${idxs.map(i=>{const r=D.F[i];return `<button data-i="${i}"><span class="t">${pill(r[0])} ${pill(r[1])} ${r[3]||''}</span><span class="m">${r[4]}${typeof r[7]==='number'?' · '+fmt(r[7]):''}${r[6]?' · ref '+r[6]:''}</span></button>`}).join('')||'<div class="note">Nothing found here. It may appear on another tab.</div>'}</div></div>`;
 document.body.appendChild(d);$('#cl').focus();d.onclick=e=>{if(e.target===d)closeRow()};$('#cl').onclick=closeRow;
 const toTable=(then)=>{d.remove();setTab('F');apply();render();const q=$('#q');if(q)q.value=state.q;jump();if(then)then()};
 const al=$('#all');if(al)al.onclick=()=>toTable();
 d.querySelectorAll('.res button').forEach(b=>b.onclick=()=>{const idx=+b.dataset.i;toTable(()=>{const ri=state.rows.findIndex(r=>r===T.F.d[idx]);openRow(ri>=0?ri:0)})})}
function goTok(tok){const lt=tok.toLowerCase();const idxs=D.F.map((r,i)=>i).filter(i=>D.F[i].join(' ').toLowerCase().includes(lt));
 const other=[['Matching references',D.RF],['Gaps',D.gaps],['Open items',D.oi],['Markup pairs',D.M],['Blank property lines',D.BK],['Resident-pays utilities',D.U]].map(([n,d])=>[n,d.filter(r=>r.join(' ').toLowerCase().includes(lt)).length]).filter(x=>x[1]);
 panel(tok,idxs,()=>{state.q=lt;state.sev='';state.paid=''},other.length?'Also in: '+other.map(x=>x[0]+' ('+x[1]+')').join(', '):'')}
document.addEventListener('click',e=>{const a=e.target.closest('.acct');if(a){e.preventDefault();e.stopPropagation();goTok(a.dataset.tok)}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('acct'))goTok(e.target.dataset.tok)});
tools();render();
</script>
